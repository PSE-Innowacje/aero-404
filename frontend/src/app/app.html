<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>AERO</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-list-header>Administracja</ion-list-header>
          <ion-item
            routerLink="/admin/helicopters"
            routerLinkActive="active-item"
            routerDirection="root"
          >
            <ion-icon slot="start" name="library-outline" />
            <ion-label>Helikoptery</ion-label>
          </ion-item>
          <ion-item
            routerLink="/admin/crew"
            routerLinkActive="active-item"
            routerDirection="root"
          >
            <ion-icon slot="start" name="people-outline" />
            <ion-label>Członkowie załogi</ion-label>
          </ion-item>
          <ion-item
            routerLink="/admin/landing-sites"
            routerLinkActive="active-item"
            routerDirection="root"
          >
            <ion-icon slot="start" name="location-outline" />
            <ion-label>Lądowiska planowe</ion-label>
          </ion-item>
          <ion-item
            routerLink="/admin/users"
            routerLinkActive="active-item"
            routerDirection="root"
          >
            <ion-icon slot="start" name="person-outline" />
            <ion-label>Użytkownicy</ion-label>
          </ion-item>
        </ion-list>

        <ion-list>
          <ion-list-header>Planowanie operacji</ion-list-header>
          <ion-item
            routerLink="/operations"
            routerLinkActive="active-item"
            routerDirection="root"
          >
            <ion-icon slot="start" name="clipboard-outline" />
            <ion-label>Lista operacji</ion-label>
          </ion-item>
        </ion-list>

        <ion-list>
          <ion-list-header>Zlecenia na lot</ion-list-header>
          <ion-item
            routerLink="/flight-tickets"
            routerLinkActive="active-item"
            routerDirection="root"
          >
            <ion-icon slot="start" name="list-outline" />
            <ion-label>Lista zleceń</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content" />
  </ion-split-pane>
</ion-app>
