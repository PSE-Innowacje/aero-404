<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Rejestracja</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="register-wrapper">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <ion-text color="danger">
          <p class="error-banner">{{ errorMessage() }}</p>
        </ion-text>
      }

      <ion-item>
        <ion-input
          label="Imię"
          labelPlacement="stacked"
          formControlName="firstName"
          type="text"
          maxlength="100"
          placeholder="Wprowadź imię"
        />
      </ion-item>
      <app-field-errors [control]="form.get('firstName')" [messages]="firstNameErrors" />

      <ion-item>
        <ion-input
          label="Nazwisko"
          labelPlacement="stacked"
          formControlName="lastName"
          type="text"
          maxlength="100"
          placeholder="Wprowadź nazwisko"
        />
      </ion-item>
      <app-field-errors [control]="form.get('lastName')" [messages]="lastNameErrors" />

      <ion-item>
        <ion-input
          label="Email"
          labelPlacement="stacked"
          formControlName="email"
          type="email"
          maxlength="100"
          placeholder="Wprowadź email"
        />
      </ion-item>
      <app-field-errors [control]="form.get('email')" [messages]="emailErrors" />

      <ion-item>
        <ion-input
          label="Hasło"
          labelPlacement="stacked"
          formControlName="password"
          type="password"
          placeholder="Minimum 5 znaków"
        />
      </ion-item>
      <app-field-errors [control]="form.get('password')" [messages]="passwordErrors" />

      <ion-button expand="block" type="submit" [disabled]="loading()" class="submit-btn">
        @if (loading()) {
          <ion-spinner name="crescent" />
        } @else {
          Zarejestruj się
        }
      </ion-button>

      <ion-button expand="block" fill="clear" routerLink="/login" class="login-link">
        Masz już konto? Zaloguj się
      </ion-button>
    </form>
  </div>
</ion-content>
