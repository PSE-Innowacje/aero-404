<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/landing-sites" text="Wróć" />
    </ion-buttons>
    <ion-title>Dodaj lądowisko</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    @if (errorMessage()) {
      <ion-text color="danger">
        <p class="error-banner">{{ errorMessage() }}</p>
      </ion-text>
    }

    <ion-item>
      <ion-input
        label="Nazwa"
        labelPlacement="stacked"
        formControlName="name"
        type="text"
        maxlength="200"
        placeholder="Wprowadź nazwę lądowiska"
      />
    </ion-item>
    <app-field-errors [control]="form.get('name')" [messages]="nameErrors" />

    <ion-item>
      <ion-input
        label="Szerokość geograficzna"
        labelPlacement="stacked"
        formControlName="latitude"
        type="number"
        min="-90"
        max="90"
        step="0.000001"
        placeholder="-90 do 90"
      />
    </ion-item>
    <app-field-errors [control]="form.get('latitude')" [messages]="latitudeErrors" />

    <ion-item>
      <ion-input
        label="Długość geograficzna"
        labelPlacement="stacked"
        formControlName="longitude"
        type="number"
        min="-180"
        max="180"
        step="0.000001"
        placeholder="-180 do 180"
      />
    </ion-item>
    <app-field-errors [control]="form.get('longitude')" [messages]="longitudeErrors" />

    <ion-button expand="block" type="submit" [disabled]="loading()" class="ion-margin-top">
      @if (loading()) {
        <ion-spinner name="crescent" />
      } @else {
        Dodaj lądowisko
      }
    </ion-button>
  </form>
</ion-content>
